  #   environment:
  #     AIRFLOW__CORE__EXECUTOR: LocalExecutor
  #     AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-foodpulse}:${POSTGRES_PASSWORD:-foodpulse}@postgres:5432/airflow
  #     AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  #     AIRFLOW_UID: ${AIRFLOW_UID:-50000}
