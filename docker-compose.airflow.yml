# Optional Airflow stack. It does not start with docker compose up.
# It uses its own Postgres on host port 5433 and does not attach to the app database.
#
#   docker compose -f docker-compose.airflow.yml build
#   docker compose -f docker-compose.airflow.yml up airflow-init
#   docker compose -f docker-compose.airflow.yml up airflow-webserver airflow-scheduler
#
# The UI is http://localhost:8080 after those commands succeed.
# Login is airflow / airflow, created by the init service. This file was not started
# as part of writing the DAG.

services:
  airflow-postgres:
    image: postgres:16-alpine
    container_name: foodpulse-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - foodpulse_airflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    image: foodpulse-airflow:2.10.5
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: foodpulse-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "nt6gbccrZv3pmeCZRTUC3V9N8krcIBy1anrijOl558k"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      FOODPULSE_ROOT: /opt/airflow/foodpulse
      FOODPULSE_SNOWFLAKE_LOAD: "1"
      AIRFLOW_UID: "50000"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/foodpulse
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username airflow --password airflow --firstname Food --lastname Pulse --role Admin --email airflow@example.com || true

  airflow-webserver:
    image: foodpulse-airflow:2.10.5
    container_name: foodpulse-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      AIRFLOW__WEBSERVER__WORKERS: "2"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "180"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/foodpulse
      - foodpulse_airflow_logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    image: foodpulse-airflow:2.10.5
    container_name: foodpulse-airflow-scheduler
    hostname: foodpulse-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/foodpulse
      - foodpulse_airflow_logs:/opt/airflow/logs
    command: scheduler

volumes:
  foodpulse_airflow_pg:
  foodpulse_airflow_logs:
